<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1295" viewBox="0 0 600 1295" role="img" aria-labelledby="title desc">
  <title id="title">Concrete slab ground preparation workflow</title>
  <desc id="desc">Seven-step workflow showing layout, remove organics, excavate, grade, place base, compact, and set forms and verify elevation.</desc>
  <defs>
  <pattern id="minorGrid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#25354C" stroke-width="1.05" opacity="0.82"/>
  </pattern>
  <pattern id="majorGrid" width="96" height="96" patternUnits="userSpaceOnUse">
    <rect width="96" height="96" fill="url(#minorGrid)"/>
    <path d="M 96 0 L 0 0 0 96" fill="none" stroke="#F97316" stroke-width="1.2" opacity="0.26"/>
  </pattern>
  <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0F172A" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
  </linearGradient>
</defs>
  <rect width="600" height="1295" fill="#0B0F19"/>
  <rect width="600" height="1295" fill="url(#majorGrid)"/>
  <rect width="600" height="1295" fill="url(#gridFade)"/>

  <text x="34" y="48" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Ground preparation workflow</text>
  <text x="34" y="78" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="15">A practical field sequence — project requirements can add or change steps.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(34,112)">
      <rect width="532" height="108" rx="16" fill="#121826" stroke="#F97316" stroke-width="2"/>
      <circle cx="38" cy="40" r="20" fill="#F97316"/><text x="38" y="46" fill="#fff" text-anchor="middle" font-size="17" font-weight="700">1</text>
      <text x="78" y="38" fill="#fff" font-size="20" font-weight="700">Layout</text>
      <text x="78" y="64" fill="#94A3B8" font-size="15"><tspan x="78" dy="0">Confirm dimensions, elevation, access,</tspan><tspan x="78" dy="20">and slab location.</tspan></text>
    </g>
    <path d="M300 224 V242" stroke="#F97316" stroke-width="3"/><path d="M300 242 l-8 -10 m8 10 l8 -10" stroke="#F97316" stroke-width="3"/>

    <g transform="translate(34,250)">
      <rect width="532" height="108" rx="16" fill="#121826" stroke="#263041" stroke-width="2"/>
      <circle cx="38" cy="40" r="20" fill="#F97316"/><text x="38" y="46" fill="#fff" text-anchor="middle" font-size="17" font-weight="700">2</text>
      <text x="78" y="38" fill="#fff" font-size="20" font-weight="700">Remove organics</text>
      <text x="78" y="64" fill="#94A3B8" font-size="15"><tspan x="78" dy="0">Remove grass, roots, organic topsoil,</tspan><tspan x="78" dy="20">and obvious soft material.</tspan></text>
    </g>
    <path d="M300 362 V380" stroke="#F97316" stroke-width="3"/><path d="M300 380 l-8 -10 m8 10 l8 -10" stroke="#F97316" stroke-width="3"/>

    <g transform="translate(34,388)">
      <rect width="532" height="108" rx="16" fill="#121826" stroke="#263041" stroke-width="2"/>
      <circle cx="38" cy="40" r="20" fill="#F97316"/><text x="38" y="46" fill="#fff" text-anchor="middle" font-size="17" font-weight="700">3</text>
      <text x="78" y="38" fill="#fff" font-size="20" font-weight="700">Excavate</text>
      <text x="78" y="64" fill="#94A3B8" font-size="15"><tspan x="78" dy="0">Excavate to the planned elevation and</tspan><tspan x="78" dy="20">resolve unsuitable conditions.</tspan></text>
    </g>
    <path d="M300 500 V518" stroke="#F97316" stroke-width="3"/><path d="M300 518 l-8 -10 m8 10 l8 -10" stroke="#F97316" stroke-width="3"/>

    <g transform="translate(34,526)">
      <rect width="532" height="108" rx="16" fill="#121826" stroke="#263041" stroke-width="2"/>
      <circle cx="38" cy="40" r="20" fill="#F97316"/><text x="38" y="46" fill="#fff" text-anchor="middle" font-size="17" font-weight="700">4</text>
      <text x="78" y="38" fill="#fff" font-size="20" font-weight="700">Grade</text>
      <text x="78" y="64" fill="#94A3B8" font-size="15"><tspan x="78" dy="0">Establish the intended subgrade elevation</tspan><tspan x="78" dy="20">and drainage relationship.</tspan></text>
    </g>
    <path d="M300 638 V656" stroke="#F97316" stroke-width="3"/><path d="M300 656 l-8 -10 m8 10 l8 -10" stroke="#F97316" stroke-width="3"/>

    <g transform="translate(34,664)">
      <rect width="532" height="108" rx="16" fill="#121826" stroke="#263041" stroke-width="2"/>
      <circle cx="38" cy="40" r="20" fill="#F97316"/><text x="38" y="46" fill="#fff" text-anchor="middle" font-size="17" font-weight="700">5</text>
      <text x="78" y="38" fill="#fff" font-size="20" font-weight="700">Place base</text>
      <text x="78" y="64" fill="#94A3B8" font-size="15"><tspan x="78" dy="0">Place the specified aggregate base in</tspan><tspan x="78" dy="20">the required layer sequence.</tspan></text>
    </g>
    <path d="M300 776 V794" stroke="#F97316" stroke-width="3"/><path d="M300 794 l-8 -10 m8 10 l8 -10" stroke="#F97316" stroke-width="3"/>

    <g transform="translate(34,802)">
      <rect width="532" height="306" rx="16" fill="#121826" stroke="#263041" stroke-width="2"/>
      <circle cx="38" cy="36" r="20" fill="#F97316"/><text x="38" y="42" fill="#fff" text-anchor="middle" font-size="17" font-weight="700">6</text>
      <text x="78" y="32" fill="#fff" font-size="20" font-weight="700">Compact</text>
      <text x="78" y="52" fill="#FDBA74" font-size="12.6" font-weight="700">Compact to project/specification requirements</text>
      <text x="78" y="72" fill="#94A3B8" font-size="11.4"><tspan x="78" dy="0">Place and compact material in lifts.</tspan><tspan x="78" dy="15">Moisture and compaction requirements vary</tspan><tspan x="78" dy="15">by material and project.</tspan></text>

      <g transform="translate(18,108)">
        <rect width="496" height="176" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.6"/>

        <!-- pass arrows -->
        <text x="14" y="16" fill="#7F8A9B" font-size="10.8">overlapping compaction passes</text>
        <path d="M20 34 H178" fill="none" stroke="#F97316" stroke-width="3.1" stroke-linecap="round"/>
        <path d="M178 34 l-11 -7 m11 7 l-11 7" fill="none" stroke="#F97316" stroke-width="3.1" stroke-linecap="round"/>
        <path d="M198 48 H46" fill="none" stroke="#FDBA74" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>
        <path d="M46 48 l11 -7 m-11 7 l11 7" fill="none" stroke="#FDBA74" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>

        <!-- plate compactor -->
        <g transform="translate(284,16)">
          <text x="86" y="10" text-anchor="middle" fill="#7F8A9B" font-size="10.8">plate compactor example</text>
          <path d="M92 18 L143 55 L124 84" fill="none" stroke="#E2E8F0" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M143 55 l15 -20" fill="none" stroke="#E2E8F0" stroke-width="3.3" stroke-linecap="round"/>
          <rect x="60" y="52" width="62" height="43" rx="7" fill="#172033" stroke="#CBD5E1" stroke-width="2.8"/>
          <path d="M70 64 h33 M70 75 h24" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
          <rect x="54" y="98" width="74" height="10" rx="3.5" fill="#CBD5E1" opacity="0.95"/>
          <rect x="44" y="108" width="94" height="12" rx="4" fill="#F97316"/>
          <path d="M40 114 H142" fill="none" stroke="#FED7AA" stroke-width="1.7" opacity="0.58"/>
          <path d="M92 121 V138" fill="none" stroke="#E2E8F0" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M92 138 l-8 -8 m8 8 l8 -8" fill="none" stroke="#E2E8F0" stroke-width="2.6" stroke-linecap="round"/>
        </g>

        <!-- layer relationship -->
        <g transform="translate(14,82)">
          <text x="0" y="0" fill="#7F8A9B" font-size="10.6">illustrative layer relationship</text>
          <rect x="0" y="12" width="468" height="26" rx="4" fill="#6B4F2A" stroke="#D6A85F" stroke-width="1.6"/>
          <path d="M8 25 H460" stroke="#F3D6A2" stroke-width="1.35" stroke-dasharray="5 5" opacity="0.86"/>
          <rect x="0" y="42" width="468" height="22" rx="4" fill="#3F4A36" stroke="#8FA37D" stroke-width="1.4"/>
          <rect x="0" y="68" width="468" height="19" rx="4" fill="#302A24" stroke="#62584E" stroke-width="1.2"/>

          <text x="10" y="29" fill="#FFF7E6" font-size="11.2" font-weight="700">COMPACTED BASE — PLACE AND COMPACT IN LIFTS</text>
          <text x="10" y="57" fill="#E2E8F0" font-size="10.7">PREPARED / COMPACTED SUBGRADE</text>
          <text x="10" y="81" fill="#D6D0C9" font-size="10.3">NATURAL SOIL / EXISTING GROUND</text>
        </g>
      </g>
    </g>
    <path d="M300 1116 V1128" stroke="#F97316" stroke-width="3"/><path d="M300 1128 l-8 -10 m8 10 l8 -10" stroke="#F97316" stroke-width="3"/>

    <g transform="translate(34,1154)">
      <rect width="532" height="78" rx="16" fill="#2A170D" stroke="#F97316" stroke-width="2"/>
      <circle cx="38" cy="35" r="20" fill="#F97316"/><text x="38" y="41" fill="#fff" text-anchor="middle" font-size="17" font-weight="700">7</text>
      <text x="78" y="28" fill="#fff" font-size="20" font-weight="700">Set forms &amp; verify</text>
      <text x="78" y="49" fill="#FDBA74" font-size="13"><tspan x="78" dy="0">Check dimensions, squareness, elevation,</tspan><tspan x="78" dy="15">and access before placement.</tspan></text>
    </g>
  </g>
</svg>